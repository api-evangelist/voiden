aid: voiden
name: Voiden
description: >-
  Voiden is an offline-first, Git-native API workspace that unifies API design,
  testing, and documentation in plain Markdown .void files stored alongside
  your codebase. It uses composable, reusable blocks (endpoints, auth, headers,
  params, bodies) that behave like code — inheritable, versionable, and
  composable — eliminating copy-paste drift across API definitions. Supports
  REST, GraphQL, WebSocket, and gRPC. Built on Electron (TypeScript), Apache 2.0 licensed.

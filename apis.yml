apis:
- aid: voiden:voiden-tool
  name: Voiden Desktop Tool
  description: >-
    Voiden is a desktop application (Electron/TypeScript) for API design,
    testing, and documentation using .void file format — plain Markdown with
    structured request blocks. Features reusable blocks with inheritance and
    composition, Git-native versioning, batch request execution with
    assertions, OpenAPI and Postman import, pre/post-request scripting
    (JavaScript, Python, shell), and offline-first operation. No public REST API.
